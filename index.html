<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calculator">
        <div id="handler">
            <p id="result">0</p>
        </div>
        <div id="linha"></div>
        <div id="buttons">
            <div id="numbers">
                <button class="numbButton number">1</button>
                <button class="numbButton number">2</button>
                <button class="numbButton number">3</button>
                <button class="numbButton number">4</button>
                <button class="numbButton number">5</button>
                <button class="numbButton number">6</button>
                <button class="numbButton number">7</button>
                <button class="numbButton number">8</button>
                <button class="numbButton number">9</button>
                <button class="number" id="zero">0</button>
                <button class="number numbButton">.</button>
            </div>
            <div id="operators">
                <button class="sideButton" id="erase">
                    <span class="material-symbols-outlined">backspace</span> 
                </button>
                <button class="sideButton" id="delete">
                    <span class="material-symbols-outlined">delete</span>
                </button>
                <button class="sideButton operaButton" id="plus">+</button>
                <button class="sideButton operaButton" id="times">x</button>
                <button class="sideButton operaButton" id="divide">÷</button>
                <button class="sideButton operaButton" id="minus">-</button>
                <button id="equal">=</button>
            </div>
        </div>
    </div>
</body>
</html>
